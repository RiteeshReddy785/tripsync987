spring.application.name=tripsync
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripsync_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Checks whether database tables have all the columns required by Java classes.
# Example: If User.java has an email field, the users table must also have an email column.

spring.jpa.hibernate.ddl-auto=validate

# Makes sure database data is fetched inside the service class, not while sending the response.
# Example: Fetch user orders inside the service instead of fetching them later in the controller.

spring.jpa.open-in-view=false
